# Snapshot Build — Ubuntu Miracast Client
# Builds dev packages on every push to main (source changes only).
# Lighter than release — no signing, no PyPI publish, just build and upload.

name: Snapshot

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"

permissions: read-all

concurrency:
  group: snapshot-${{ github.sha }}
  cancel-in-progress: true

env:
  GI_TYPELIB_PATH: /usr/lib/x86_64-linux-gnu/girepository-1.0

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v6.0.0
        with:
          enable-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgirepository-2.0-dev libcairo2-dev pkg-config python3-dev \
            gir1.2-gtk-4.0 gir1.2-adw-1 \
            gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 \
            wpasupplicant \
            build-essential debhelper dh-python fakeroot

      - name: Install and test
        run: |
          uv sync --group test
          uv run pytest --cov=miracast_client tests/

      - name: Compute snapshot version
        id: version
        run: |
          SNAPSHOT_VERSION=$(python scripts/release_notes.py next-dev)
          echo "snapshot_version=${SNAPSHOT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Snapshot version: ${SNAPSHOT_VERSION}"
          echo "${SNAPSHOT_VERSION}" > VERSION

      - name: Build Python package
        run: uv build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Upload snapshot artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snapshot-${{ steps.version.outputs.snapshot_version }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          retention-days: 7
