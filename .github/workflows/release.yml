# Release Pipeline — Ubuntu Miracast Client
# Triggered manually via workflow_dispatch. Determines version from conventional commits,
# builds packages, signs with Sigstore, generates SBOM, attests provenance (SLSA L2),
# and publishes to PyPI via OIDC trusted publishing.
#
# Security features:
#   ✅ SHA-pinned actions
#   ✅ Minimal permissions per job
#   ✅ SLSA Build L2 provenance (actions/attest-build-provenance)
#   ✅ Sigstore signing of release artifacts
#   ✅ SBOM generation (CycloneDX)
#   ✅ PyPI trusted publishing (OIDC, no API tokens)
#   ✅ GitHub environment protection rules

name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type (auto = determined from commits)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions: read-all

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────
  # Prepare: Determine version and generate release notes
  # ─────────────────────────────────────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
      release_notes: ${{ steps.notes.outputs.release_notes }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Determine version bump
        id: version
        run: |
          CURRENT_VERSION=$(cat VERSION)
          echo "Current version: ${CURRENT_VERSION}"

          if [ "${{ inputs.bump }}" = "auto" ]; then
            BUMP_TYPE=$(python scripts/release_notes.py bump-type)
          else
            BUMP_TYPE="${{ inputs.bump }}"
          fi
          echo "Bump type: ${BUMP_TYPE}"

          NEW_VERSION=$(python scripts/release_notes.py bump)
          if [ "${{ inputs.bump }}" != "auto" ]; then
            IFS='.' read -r major minor patch <<< "${CURRENT_VERSION}"
            case "${{ inputs.bump }}" in
              major)
                if [ "$major" = "0" ]; then
                  NEW_VERSION="0.$((minor + 1)).0"
                else
                  NEW_VERSION="$((major + 1)).0.0"
                fi
                ;;
              minor) NEW_VERSION="${major}.$((minor + 1)).0" ;;
              patch) NEW_VERSION="${major}.${minor}.$((patch + 1))" ;;
            esac
          fi

          echo "New version: ${NEW_VERSION}"
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        run: |
          NOTES=$(python scripts/release_notes.py notes)
          {
            echo "release_notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────
  # Test: Full test suite must pass before release
  # ─────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: read
    env:
      GI_TYPELIB_PATH: /usr/lib/x86_64-linux-gnu/girepository-1.0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.0
        with:
          enable-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgirepository-2.0-dev libcairo2-dev pkg-config python3-dev \
            gir1.2-gtk-4.0 gir1.2-adw-1 \
            gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 \
            wpasupplicant

      - name: Install and test
        run: |
          uv sync --group test
          uv run pytest --cov=miracast_client tests/

  # ─────────────────────────────────────────────────────────────
  # Build: Create Python packages and Debian package
  # ─────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: [prepare, test]
    permissions:
      contents: read
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    env:
      GI_TYPELIB_PATH: /usr/lib/x86_64-linux-gnu/girepository-1.0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.0
        with:
          enable-cache: true

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgirepository-2.0-dev libcairo2-dev pkg-config python3-dev \
            gir1.2-gtk-4.0 gir1.2-adw-1 \
            gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 \
            wpasupplicant \
            build-essential debhelper dh-python fakeroot lintian

      - name: Set release version
        run: |
          echo "${{ needs.prepare.outputs.new_version }}" > VERSION

      - name: Build Python package
        run: uv build

      - name: Build Debian package
        run: |
          chmod +x debian/rules
          chmod +x debian/ubuntu-miracast-client.postinst
          chmod +x debian/ubuntu-miracast-client.postrm
          dpkg-buildpackage -us -uc -b || true
          mkdir -p dist/deb
          cp ../ubuntu-miracast-client_*.deb dist/deb/ 2>/dev/null || echo "Debian build skipped"

      - name: Generate SBOM (CycloneDX)
        run: |
          uvx cyclonedx-py environment \
            --output dist/sbom.cdx.json \
            --format json \
            --schema-version 1.5

      - name: Generate artifact hashes
        id: hash
        run: |
          cd dist
          echo "hashes=$(sha256sum *.whl *.tar.gz | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-packages
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/deb/*.deb
            dist/sbom.cdx.json
          retention-days: 5

  # ─────────────────────────────────────────────────────────────
  # Publish: Tag, attest, sign, and publish
  # ─────────────────────────────────────────────────────────────
  publish:
    runs-on: ubuntu-latest
    needs: [prepare, build]
    permissions:
      contents: write
      id-token: write
      attestations: write
    environment:
      name: pypi
      url: https://pypi.org/p/ubuntu-miracast-client
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-packages
          path: dist/

      - name: Tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "${{ needs.prepare.outputs.new_version }}" > VERSION
          git add VERSION
          git commit -m "release: v${{ needs.prepare.outputs.new_version }}"
          git tag -a "v${{ needs.prepare.outputs.new_version }}" -m "Release v${{ needs.prepare.outputs.new_version }}"
          git push origin main --tags

      - name: Attest build provenance (SLSA L2)
        uses: actions/attest-build-provenance@db473fddc028af60658334401dc6fa3ffd8669fd # v2.3.0
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Sign with Sigstore
        uses: sigstore/gh-action-sigstore-python@f514d46b907ebcd5bedc05145c03b69c1edd8b46 # v3.0.0
        with:
          inputs: dist/*.tar.gz dist/*.whl

      - name: Publish to PyPI (OIDC Trusted Publishing)
        if: github.repository_owner == 'eddypepy'
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # release/v1
        with:
          packages-dir: dist/
          attestations: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@01570a1f39cb168c169c802c3bceb9e93fb10974 # v2.3.0
        with:
          tag_name: v${{ needs.prepare.outputs.new_version }}
          name: v${{ needs.prepare.outputs.new_version }}
          draft: false
          prerelease: false
          generate_release_notes: false
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/deb/*.deb
            dist/sbom.cdx.json
            dist/*.sigstore.json
          body: |
            # v${{ needs.prepare.outputs.new_version }}

            ${{ needs.prepare.outputs.release_notes }}

            ---

            ## Verification

            ### Verify provenance (SLSA)
            ```bash
            gh attestation verify ubuntu_miracast_client-${{ needs.prepare.outputs.new_version }}-py3-none-any.whl --owner ${{ github.repository_owner }}
            ```

            ### Verify signature (Sigstore)
            ```bash
            pip install sigstore
            sigstore verify identity \
              --cert-oidc-issuer https://token.actions.githubusercontent.com \
              --cert-identity ${{ github.server_url }}/${{ github.repository }}/.github/workflows/release.yml@refs/heads/main \
              ubuntu_miracast_client-${{ needs.prepare.outputs.new_version }}.tar.gz
            ```

            ## Installation

            ### From PyPI
            ```bash
            pip install ubuntu-miracast-client==${{ needs.prepare.outputs.new_version }}
            ```

            ### From Debian Package
            ```bash
            sudo apt install ./ubuntu-miracast-client_${{ needs.prepare.outputs.new_version }}_amd64.deb
            ```
