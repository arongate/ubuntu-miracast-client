name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run Test Suite

    env:
      GI_TYPELIB_PATH: /usr/lib/x86_64-linux-gnu/girepository-1.0

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgirepository-2.0-dev libcairo2-dev pkg-config python3-dev \
          gir1.2-gtk-4.0 gir1.2-adw-1 \
          gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 \
          wpasupplicant

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyGObject pycairo
        pip install pytest pytest-cov
        pip install -e . --no-deps

    - name: Run tests
      run: |
        pytest --cov=miracast_client --cov-report=xml tests/

  build:
    runs-on: ubuntu-latest
    name: Build Packages
    needs: test

    env:
      GI_TYPELIB_PATH: /usr/lib/x86_64-linux-gnu/girepository-1.0

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgirepository-2.0-dev libcairo2-dev pkg-config python3-dev \
          gir1.2-gtk-4.0 gir1.2-adw-1 \
          gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 \
          wpasupplicant \
          build-essential debhelper dh-python fakeroot lintian
        python -m pip install --upgrade pip
        pip install PyGObject pycairo
        pip install build twine
        pip install -e . --no-deps

    - name: Extract version from tag
      id: get_version
      run: |
        TAG_VERSION="${GITHUB_REF#refs/tags/v}"
        echo "VERSION=${TAG_VERSION}" >> $GITHUB_ENV
        echo "version=${TAG_VERSION}" >> $GITHUB_OUTPUT

    - name: Verify version matches tag
      run: |
        PACKAGE_VERSION=$(grep -oP '__version__\s*=\s*"\K[^"]+' src/miracast_client/__init__.py)
        TAG_VERSION="${GITHUB_REF#refs/tags/v}"
        if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
          echo "::error::Version mismatch: __init__.py has '$PACKAGE_VERSION' but tag is 'v$TAG_VERSION'"
          exit 1
        fi
        echo "Version verified: $PACKAGE_VERSION"

    - name: Generate changelog from git commits
      id: changelog
      run: |
        PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        if [ -z "$PREVIOUS_TAG" ]; then
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" HEAD)
        else
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" "${PREVIOUS_TAG}..HEAD")
        fi
        echo "$CHANGELOG" > /tmp/changelog.txt
        {
          echo "changelog<<EOF"
          echo "$CHANGELOG"
          echo "EOF"
        } >> $GITHUB_OUTPUT

    - name: Build Python package
      run: |
        python -m build

    - name: Build Debian package
      run: |
        chmod +x debian/rules
        chmod +x debian/ubuntu-miracast-client.postinst
        chmod +x debian/ubuntu-miracast-client.postrm
        dpkg-buildpackage -us -uc -b
        mkdir -p dist/deb
        cp ../ubuntu-miracast-client_*.deb dist/deb/

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-packages
        path: |
          dist/*.whl
          dist/*.tar.gz
          dist/deb/*.deb
        retention-days: 5

    outputs:
      version: ${{ steps.get_version.outputs.version }}
      changelog: ${{ steps.changelog.outputs.changelog }}

  publish:
    runs-on: ubuntu-latest
    name: Publish Release
    needs: build

    steps:
    - uses: actions/checkout@v4

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: release-packages
        path: dist/

    - name: Attest build provenance
      uses: actions/attest-build-provenance@v2
      with:
        subject-path: |
          dist/*.whl
          dist/*.tar.gz
          dist/deb/*.deb

    - name: Publish to PyPI
      if: github.repository_owner == 'eddypepy'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: Release v${{ needs.build.outputs.version }}
        draft: false
        prerelease: false
        files: |
          dist/*.whl
          dist/*.tar.gz
          dist/deb/*.deb
        body: |
          # Ubuntu Miracast Client v${{ needs.build.outputs.version }}

          ## Changes

          ${{ needs.build.outputs.changelog }}

          ## Installation

          ### From Debian Package
          ```bash
          sudo apt install ./ubuntu-miracast-client_${{ needs.build.outputs.version }}_amd64.deb
          ```

          ### From PyPI
          ```bash
          pip install ubuntu-miracast-client==${{ needs.build.outputs.version }}
          ```

          ### From Python Package (wheel)
          ```bash
          pip install ubuntu_miracast_client-${{ needs.build.outputs.version }}-py3-none-any.whl
          ```
