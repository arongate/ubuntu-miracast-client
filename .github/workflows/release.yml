name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type (auto = determined from commits)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    name: Prepare Release

    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
      release_notes: ${{ steps.notes.outputs.release_notes }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Determine version bump
      id: version
      run: |
        CURRENT_VERSION=$(cat VERSION)
        echo "Current version: ${CURRENT_VERSION}"

        if [ "${{ inputs.bump }}" = "auto" ]; then
          BUMP_TYPE=$(python scripts/release_notes.py bump-type)
        else
          BUMP_TYPE="${{ inputs.bump }}"
        fi
        echo "Bump type: ${BUMP_TYPE}"

        NEW_VERSION=$(python scripts/release_notes.py bump)
        if [ "${{ inputs.bump }}" != "auto" ]; then
          # Manual override: recalculate
          IFS='.' read -r major minor patch <<< "${CURRENT_VERSION}"
          case "${{ inputs.bump }}" in
            major)
              if [ "$major" = "0" ]; then
                NEW_VERSION="0.$((minor + 1)).0"
              else
                NEW_VERSION="$((major + 1)).0.0"
              fi
              ;;
            minor) NEW_VERSION="${major}.$((minor + 1)).0" ;;
            patch) NEW_VERSION="${major}.${minor}.$((patch + 1))" ;;
          esac
        fi

        echo "New version: ${NEW_VERSION}"
        echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT
        echo "bump_type=${BUMP_TYPE}" >> $GITHUB_OUTPUT

    - name: Generate release notes
      id: notes
      run: |
        NOTES=$(python scripts/release_notes.py notes)
        {
          echo "release_notes<<EOF"
          echo "$NOTES"
          echo "EOF"
        } >> $GITHUB_OUTPUT

  test:
    runs-on: ubuntu-latest
    name: Run Test Suite
    needs: prepare

    env:
      GI_TYPELIB_PATH: /usr/lib/x86_64-linux-gnu/girepository-1.0

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgirepository-2.0-dev libcairo2-dev pkg-config python3-dev \
          gir1.2-gtk-4.0 gir1.2-adw-1 \
          gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 \
          wpasupplicant

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyGObject pycairo
        pip install pytest pytest-cov
        pip install -e . --no-deps

    - name: Run tests
      run: |
        pytest --cov=miracast_client --cov-report=xml tests/

  build:
    runs-on: ubuntu-latest
    name: Build Packages
    needs: [prepare, test]

    env:
      GI_TYPELIB_PATH: /usr/lib/x86_64-linux-gnu/girepository-1.0

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgirepository-2.0-dev libcairo2-dev pkg-config python3-dev \
          gir1.2-gtk-4.0 gir1.2-adw-1 \
          gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 \
          wpasupplicant \
          build-essential debhelper dh-python fakeroot lintian
        python -m pip install --upgrade pip
        pip install PyGObject pycairo
        pip install build twine
        pip install -e . --no-deps

    - name: Set release version
      run: |
        echo "${{ needs.prepare.outputs.new_version }}" > VERSION
        echo "Building version: $(cat VERSION)"

    - name: Build Python package
      run: |
        python -m build

    - name: Build Debian package
      run: |
        chmod +x debian/rules
        chmod +x debian/ubuntu-miracast-client.postinst
        chmod +x debian/ubuntu-miracast-client.postrm
        dpkg-buildpackage -us -uc -b || true
        mkdir -p dist/deb
        cp ../ubuntu-miracast-client_*.deb dist/deb/ 2>/dev/null || echo "Debian build skipped"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-packages
        path: |
          dist/*.whl
          dist/*.tar.gz
          dist/deb/*.deb
        retention-days: 5

  publish:
    runs-on: ubuntu-latest
    name: Publish Release
    needs: [prepare, build]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: release-packages
        path: dist/

    - name: Tag release
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        # Update VERSION file
        echo "${{ needs.prepare.outputs.new_version }}" > VERSION
        git add VERSION
        git commit -m "release: v${{ needs.prepare.outputs.new_version }}"
        git tag -a "v${{ needs.prepare.outputs.new_version }}" -m "Release v${{ needs.prepare.outputs.new_version }}"
        git push origin main --tags

    - name: Attest build provenance
      uses: actions/attest-build-provenance@v2
      with:
        subject-path: |
          dist/*.whl
          dist/*.tar.gz
          dist/deb/*.deb

    - name: Publish to PyPI
      if: github.repository_owner == 'eddypepy'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ needs.prepare.outputs.new_version }}
        name: v${{ needs.prepare.outputs.new_version }}
        draft: false
        prerelease: false
        files: |
          dist/*.whl
          dist/*.tar.gz
          dist/deb/*.deb
        body: |
          # v${{ needs.prepare.outputs.new_version }}

          ${{ needs.prepare.outputs.release_notes }}

          ---

          ## Installation

          ### From Debian Package
          ```bash
          sudo apt install ./ubuntu-miracast-client_${{ needs.prepare.outputs.new_version }}_amd64.deb
          ```

          ### From PyPI
          ```bash
          pip install ubuntu-miracast-client==${{ needs.prepare.outputs.new_version }}
          ```
