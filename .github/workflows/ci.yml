name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test (Python ${{ matrix.python-version }})

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-gi python3-cairo python3-gst-1.0 gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 wpasupplicant

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install pytest-cov

    - name: Lint with flake8
      if: matrix.python-version == '3.12'
      run: |
        flake8 src tests

    - name: Type check with mypy
      if: matrix.python-version == '3.12'
      run: |
        mypy src

    - name: Check formatting with black
      if: matrix.python-version == '3.12'
      run: |
        black --check src tests

    - name: Run tests with coverage
      run: |
        pytest --cov=miracast_client --cov-report=xml tests/

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-py${{ matrix.python-version }}
        path: coverage.xml
        retention-days: 14
