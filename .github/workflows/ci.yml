# CI Pipeline — Ubuntu Miracast Client
# Runs on every push/PR to main. Tests, lints, type-checks, and security scans.
#
# OpenSSF Scorecard compliance:
#   ✅ Token-Permissions (read-all default, explicit per-job)
#   ✅ Pinned-Dependencies (SHA-pinned actions)
#   ✅ CI-Tests (tests on all PRs)
#   ✅ SAST (CodeQL + Bandit)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_DEFAULT: "3.12"
  GI_TYPELIB_PATH: /usr/lib/x86_64-linux-gnu/girepository-1.0
  UV_SYSTEM_PYTHON: "true"

jobs:
  # ─────────────────────────────────────────────────────────────
  # Path filtering — skip unnecessary jobs when only docs change
  # ─────────────────────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      src: ${{ steps.filter.outputs.src }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            src:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
            ci:
              - '.github/workflows/**'

  # ─────────────────────────────────────────────────────────────
  # Lint & Format (Ruff)
  # ─────────────────────────────────────────────────────────────
  lint:
    needs: changes
    if: needs.changes.outputs.src == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.0
        with:
          enable-cache: true

      - name: Lint with Ruff
        run: uvx ruff check src/ tests/

      - name: Check formatting with Ruff
        run: uvx ruff format --check src/ tests/

  # ─────────────────────────────────────────────────────────────
  # Type Checking (mypy)
  # ─────────────────────────────────────────────────────────────
  typecheck:
    needs: changes
    if: needs.changes.outputs.src == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.0
        with:
          enable-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgirepository-2.0-dev libcairo2-dev pkg-config python3-dev \
            gir1.2-gtk-4.0 gir1.2-adw-1 \
            gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0

      - name: Install project with typing dependencies
        run: |
          uv sync --group typing --group dev

      - name: Run mypy
        run: uv run mypy src/

  # ─────────────────────────────────────────────────────────────
  # Test Matrix (Python 3.10, 3.11, 3.12)
  # ─────────────────────────────────────────────────────────────
  test:
    needs: changes
    if: needs.changes.outputs.src == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.0
        with:
          enable-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgirepository-2.0-dev libcairo2-dev pkg-config python3-dev \
            gir1.2-gtk-4.0 gir1.2-adw-1 \
            gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 \
            wpasupplicant

      - name: Install project with test dependencies
        run: uv sync --group test

      - name: Run tests with coverage
        run: |
          uv run pytest --cov=miracast_client --cov-report=xml --cov-report=term-missing tests/

      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.python-version == '3.12'
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  # ─────────────────────────────────────────────────────────────
  # Security: CodeQL (SAST)
  # ─────────────────────────────────────────────────────────────
  codeql:
    needs: changes
    if: needs.changes.outputs.src == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: +security-extended,security-and-quality

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"

  # ─────────────────────────────────────────────────────────────
  # Security: Bandit (Python-specific security linting)
  # ─────────────────────────────────────────────────────────────
  bandit:
    needs: changes
    if: needs.changes.outputs.src == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.0

      - name: Run Bandit security scan
        run: |
          uvx bandit -r src/ -f sarif -o bandit-results.sarif --severity-level medium || true

      - name: Upload Bandit SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: bandit-results.sarif
          category: bandit

  # ─────────────────────────────────────────────────────────────
  # Security: Dependency audit
  # ─────────────────────────────────────────────────────────────
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.0

      - name: Audit dependencies for vulnerabilities
        run: uv audit

  # ─────────────────────────────────────────────────────────────
  # Dependency review (PR only — blocks malicious new deps)
  # ─────────────────────────────────────────────────────────────
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@da24556b548a50705dd671f47852072ea4c105d9 # v4.7.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # ─────────────────────────────────────────────────────────────
  # CI Gate — aggregates all required checks for branch protection
  # ─────────────────────────────────────────────────────────────
  ci-pass:
    if: always()
    needs: [lint, typecheck, test, codeql, bandit, audit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "❌ One or more CI jobs failed"
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "⚠️ One or more CI jobs were cancelled"
            exit 1
          fi
          echo "✅ All CI checks passed"
