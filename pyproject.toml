# ============================================================
# Ubuntu Miracast Client — pyproject.toml
# PEP 621 metadata + PEP 735 dependency groups + Ruff + mypy
# ============================================================

# ─────────────────────────────────────────────────────────────
# BUILD SYSTEM (PEP 517/518)
# ─────────────────────────────────────────────────────────────
[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

# ─────────────────────────────────────────────────────────────
# PROJECT METADATA (PEP 621)
# ─────────────────────────────────────────────────────────────
[project]
name = "ubuntu-miracast-client"
version = "0.0.1"
description = "A desktop application for Ubuntu that enables screen and application casting to Miracast-compatible devices"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Eddy Pepy", email = "example@example.com" },
]
keywords = [
    "miracast",
    "wifi-direct",
    "screen-casting",
    "wireless-display",
    "gtk",
    "gnome",
    "wfd",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: System :: Networking",
]

# NOTE: PyGObject/pycairo require system C libraries and GI typelibs.
# They are listed for metadata completeness but pip install may fail
# without: sudo apt install libgirepository-2.0-dev libcairo2-dev
dependencies = [
    "PyGObject>=3.42.0",
    "pycairo>=1.20.0",
]

[project.urls]
Homepage = "https://github.com/eddypepy/ubuntu-miracast-client"
Repository = "https://github.com/eddypepy/ubuntu-miracast-client.git"
Issues = "https://github.com/eddypepy/ubuntu-miracast-client/issues"
Changelog = "https://github.com/eddypepy/ubuntu-miracast-client/blob/main/CHANGELOG.md"
Documentation = "https://github.com/eddypepy/ubuntu-miracast-client/tree/main/docs"

[project.gui-scripts]
ubuntu-miracast-client = "miracast_client.app:main"

# ─────────────────────────────────────────────────────────────
# DEPENDENCY GROUPS (PEP 735) — NOT published to PyPI
# ─────────────────────────────────────────────────────────────
[dependency-groups]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "typing" },
    "pre-commit>=3.6",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "pytest-xdist>=3.5",
]
lint = [
    "ruff>=0.8",
]
typing = [
    "mypy>=1.13",
]

# ─────────────────────────────────────────────────────────────
# HATCHLING BUILD CONFIGURATION
# ─────────────────────────────────────────────────────────────
[tool.hatch.build.targets.wheel]
packages = ["src/miracast_client"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "data/",
    "debian/",
    "docs/",
    "scripts/",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "LICENSE",
    "VERSION",
    "pyproject.toml",
]

# ─────────────────────────────────────────────────────────────
# RUFF — Linter + Formatter (replaces black, isort, flake8)
# ─────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "RUF",    # ruff-specific rules
    "S",      # flake8-bandit (security)
]
ignore = [
    "E501",   # line length (handled by formatter)
    "S603",   # subprocess call - check for execution of untrusted input (too noisy for this project)
    "S607",   # starting a process with a partial executable path
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["ARG", "S101", "S603", "S607"]
"__init__.py" = ["F401"]
"src/miracast_client/ui/*" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["miracast_client"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ─────────────────────────────────────────────────────────────
# MYPY — Type Checking
# ─────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["gi", "gi.repository", "gi.repository.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["dbus", "dbus.*"]
ignore_missing_imports = true

# ─────────────────────────────────────────────────────────────
# PYTEST
# ─────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: requires D-Bus or network services",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:importlib._bootstrap",
]

# ─────────────────────────────────────────────────────────────
# COVERAGE
# ─────────────────────────────────────────────────────────────
[tool.coverage.run]
source_pkgs = ["miracast_client"]
branch = true
parallel = true

[tool.coverage.report]
fail_under = 70
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@overload",
    "raise NotImplementedError",
]

[tool.coverage.paths]
miracast_client = ["src/miracast_client", "*/miracast_client"]
